name: ci

# CUR-20: Complete NIU-12 v1.0 §1.2 gate set for cur-web.
#
# Per NIU-12 §1.3 (Tier 1 layout) all required jobs live in this one
# workflow file. Job names are the protection-rule contract:
#   - `ci`         lint + tsc + unit tests (when wired)
#   - `build`      next build (the same command Railway runs)
#   - `secret-scan` Semgrep p/secrets + Gitleaks
#   - `e2e`        Playwright (stub today — Playwright not yet wired)
#
# Cost-aware mode per .github/CI-COST-MODE.md and NIU-12 §5.14:
#  - Draft-PR skip (§5.6)
#  - paths-ignore floor (§5.7)
#  - skip-ci label honored (§5.8)
#  - Same-ref cancel on long gates (§5.9)
#  - Per-gate trigger discipline (§5.11)
#
# Third-party actions SHA-pinned per §5.3 / §6.5. First-party actions/*
# tag-pinned (GitHub controls the namespace).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "runbooks/**"
      - ".confluence/**"
      - "CHANGELOG.md"
      - "LICENSE"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (next lint / eslint)
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # NIU-12 §2.1 / §4 Layer 3: unit tests.
      # cur-web has no unit test framework wired yet (no vitest devDep,
      # no test files). When Vitest lands, replace this stub with
      # `npx vitest run`. Stubbed (not silently absent) so the gate
      # name is real and tracked.
      - name: Unit tests (stub — Vitest not yet wired)
        run: |
          echo "::notice::Vitest not yet wired in cur-web. NIU-12 §4 Layer 3 stub."
          echo "When Vitest lands, replace with: npx vitest run"

  # Existing gate — preserved. Branch protection on `main` requires the
  # `build` context, so the name must stay `build`.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `next build` succeeds without DATABASE_URL / NEXTAUTH_SECRET because
      # `lib/db.ts` lazy-inits the pg Pool and NextAuth providers are gated
      # behind env-var presence checks. Don't reintroduce module-level Pool
      # construction or this step will start failing.
      - name: Build
        run: npm run build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    permissions:
      contents: read
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks defaults to scanning the working tree only; full
          # history lets it also catch a secret that was committed and
          # then "removed" in a later commit on the same PR branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run Semgrep (p/secrets baseline)
        # Per NIU-12 §6 the `secret-scan` gate bundles SAST + secret
        # detection. Keep the ruleset narrow for cur-web (Tier 1, no
        # production traffic yet) — scale up to MRE's full ruleset
        # (security-audit, owasp-top-ten, etc.) once cur-web nears prod.
        run: |
          semgrep scan \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/react \
            --config=p/nextjs \
            --severity=ERROR \
            --error \
            --sarif --output=semgrep.sarif

      - name: Semgrep findings (text, on failure)
        # The gate step above writes findings only to the SARIF artifact, so a
        # failure shows a count but not the offending rule/file in the log. This
        # failure-only re-run prints the findings as text for quick triage. It
        # never affects the gate (no --error, `|| true`).
        if: failure()
        run: |
          semgrep scan \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/react \
            --config=p/nextjs \
            --severity=ERROR || true

      - name: Upload Semgrep SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

      - name: Run Gitleaks
        # `gitleaks detect` exits non-zero on findings, blocking the PR.
        # --redact strips matched secret values from the log so a public
        # CI log doesn't double-leak. We run this AFTER semgrep with
        # `if: always()` so a semgrep failure doesn't hide a gitleaks failure.
        if: always()
        run: |
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --report-format=sarif \
            --report-path=gitleaks.sarif

      - name: Upload Gitleaks SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'skip-ci') && !contains(github.event.pull_request.labels.*.name, 'skip-e2e')
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # E2E is a stub today. Playwright is not yet wired into cur-web
      # (no @playwright/test devDep, no playwright.config.ts, no
      # e2e/ directory). The gate exists by name so branch protection
      # can reference it; replace with the full Playwright + Postgres-in-Docker
      # pattern from NIU-12 §7 when the test suite is authored.
      #
      # Per NIU-12 §1.2 — for web apps, `e2e` is one of the four required
      # gates. Stubbing (rather than omitting) keeps the gate-name contract
      # honest and the protection rule simple.
      - name: e2e stub (Playwright not yet wired)
        run: |
          echo "::notice::E2E suite stub. NIU-12 §7 pattern to be wired."
          echo "When implemented:"
          echo "  - Playwright + Postgres-in-Docker (loopback only)"
          echo "  - @smoke tag subset for PR-to-non-main"
          echo "  - Full suite for PR-to-main"
